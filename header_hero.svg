<svg width="1280" height="220" viewBox="0 0 1280 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0F2E"/>
      <stop offset="100%" stop-color="#141a3d"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>

    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dffe0"/>
      <stop offset="55%" stop-color="#00FFCC"/>
      <stop offset="100%" stop-color="#00a381"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdcae"/>
      <stop offset="60%" stop-color="#F2C18C"/>
      <stop offset="100%" stop-color="#d69f68"/>
    </linearGradient>
    <linearGradient id="torsoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b5c"/>
      <stop offset="55%" stop-color="#1a1a3d"/>
      <stop offset="100%" stop-color="#0d0d24"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20204a"/>
      <stop offset="100%" stop-color="#05050f"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropsh" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="220" fill="url(#sky)"/>

  <g fill="#00FFCC">
    <circle cx="80" cy="30" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="55" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="25" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="45" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="20" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="50" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="0" y="188" width="1280" height="32" fill="url(#ground)"/>
  <rect x="0" y="188" width="1280" height="6" fill="#0A0F2E" opacity="0.25"/>

  <g font-family="JetBrains Mono, monospace" font-weight="700" text-anchor="middle">
    <g transform="translate(105,88)">
      <animateTransform attributeName="transform" type="translate" values="105,88;105,82;105,88" dur="1.6s" repeatCount="indefinite"/>
      <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#1a1a3d" stroke="#00FFCC" stroke-width="3"/>
      <text x="0" y="7" fill="#00FFCC" font-size="17">M</text>
    </g>
    <g transform="translate(245,88)">
      <animateTransform attributeName="transform" type="translate" values="245,88;245,82;245,88" dur="1.6s" begin="0.15s" repeatCount="indefinite"/>
      <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#1a1a3d" stroke="#00FFCC" stroke-width="3"/>
      <text x="0" y="7" fill="#00FFCC" font-size="17">E</text>
    </g>
    <g transform="translate(385,88)">
      <animateTransform attributeName="transform" type="translate" values="385,88;385,82;385,88" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
      <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#1a1a3d" stroke="#00FFCC" stroke-width="3"/>
      <text x="0" y="7" fill="#00FFCC" font-size="17">R</text>
    </g>
    <g transform="translate(525,88)">
      <animateTransform attributeName="transform" type="translate" values="525,88;525,82;525,88" dur="1.6s" begin="0.45s" repeatCount="indefinite"/>
      <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#1a1a3d" stroke="#00FFCC" stroke-width="3"/>
      <text x="0" y="7" fill="#00FFCC" font-size="17">N</text>
    </g>
    <g transform="translate(665,88)">
      <animateTransform attributeName="transform" type="translate" values="665,88;665,82;665,88" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
      <rect x="-32" y="-24" width="64" height="48" rx="8" fill="#1a1a3d" stroke="#FF9A3C" stroke-width="3"/>
      <text x="0" y="7" fill="#FF9A3C" font-size="14">JAVA</text>
    </g>
    <g transform="translate(805,88)">
      <animateTransform attributeName="transform" type="translate" values="805,88;805,82;805,88" dur="1.6s" begin="0.75s" repeatCount="indefinite"/>
      <rect x="-26" y="-24" width="52" height="48" rx="8" fill="#1a1a3d" stroke="#00FFCC" stroke-width="3"/>
      <text x="0" y="7" fill="#00FFCC" font-size="15">AI</text>
    </g>
    <g transform="translate(955,88)">
      <animateTransform attributeName="transform" type="translate" values="955,88;955,82;955,88" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
      <rect x="-46" y="-24" width="92" height="48" rx="8" fill="#1a1a3d" stroke="#FF9A3C" stroke-width="3"/>
      <text x="0" y="7" fill="#FF9A3C" font-size="12">AGENTS</text>
    </g>
    <g transform="translate(1110,88)">
      <animateTransform attributeName="transform" type="translate" values="1110,88;1110,82;1110,88" dur="1.6s" begin="1.05s" repeatCount="indefinite"/>
      <rect x="-32" y="-24" width="64" height="48" rx="8" fill="#1a1a3d" stroke="#00FFCC" stroke-width="3"/>
      <text x="0" y="7" fill="#00FFCC" font-size="13">DSA</text>
    </g>
    <g transform="translate(1225,88)">
      <animateTransform attributeName="transform" type="translate" values="1225,88;1225,82;1225,88" dur="1.6s" begin="1.2s" repeatCount="indefinite"/>
      <rect x="-52" y="-24" width="104" height="48" rx="8" fill="#1a1a3d" stroke="#FF9A3C" stroke-width="3"/>
      <text x="0" y="7" fill="#FF9A3C" font-size="10.5">SYS DESIGN</text>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="-60,0;1340,0" dur="10s" repeatCount="indefinite"/>

    <ellipse cx="0" cy="196" rx="16" ry="5" fill="url(#shadowGrad)">
      <animate attributeName="rx" values="16;10;16;10;16" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.4;0.9;0.4;0.9" dur="0.6s" repeatCount="indefinite"/>
    </ellipse>

    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,-11; 0,0; 0,-11; 0,0" dur="0.6s" repeatCount="indefinite"/>
      <g transform="translate(0,150)" filter="url(#dropsh)">
        <rect x="-14" y="-46" width="28" height="10" rx="2" fill="url(#capGrad)"/>
        <rect x="-15" y="-38" width="35" height="8" rx="2" fill="url(#capGrad)"/>
        <rect x="18" y="-36" width="4" height="4" fill="#00a381"/>
        <rect x="-12" y="-30" width="24" height="18" rx="3" fill="url(#skinGrad)"/>
        <rect x="7" y="-28" width="3" height="14" fill="#c98a58" opacity="0.5"/>
        <text x="0" y="-40" font-family="monospace" font-size="8" fill="#0A0F2E" text-anchor="middle" font-weight="700">&lt;/&gt;</text>
        <rect x="-14" y="-12" width="28" height="20" rx="2" fill="url(#torsoGrad)" stroke="#00FFCC" stroke-width="1.2"/>
        <rect x="8" y="-12" width="6" height="20" fill="#000000" opacity="0.25"/>
        <rect x="-20" y="-10" width="8" height="14" rx="2" fill="url(#skinGrad)"/>
        <rect x="12" y="-10" width="8" height="14" rx="2" fill="url(#skinGrad)"/>
        <rect x="-12" y="8" width="10" height="16" rx="2" fill="url(#legGrad)">
          <animate attributeName="height" values="16;8;16" dur="0.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="2" y="8" width="10" height="16" rx="2" fill="url(#legGrad)">
          <animate attributeName="height" values="8;16;8" dur="0.3s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <text x="640" y="210" font-family="JetBrains Mono, monospace" font-size="12" fill="#5a5f8a" text-anchor="middle" letter-spacing="2">MERN · JAVA · AI AGENTS · DSA · SYSTEM DESIGN</text>
</svg>
